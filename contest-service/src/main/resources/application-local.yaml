spring:
  datasource:
    url: jdbc:mysql://${DB_HOST:localhost}:${DB_PORT:3308}/${CONTEST_DB_NAME:contest_db}
    username: ${SPRING_DATASOURCE_USERNAME:${DB_USERNAME}}
    password: ${SPRING_DATASOURCE_PASSWORD:${DB_PASSWORD}}
  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6380}
      password: ${SPRING_DATA_REDIS_PASSWORD:${REDIS_PASSWORD}}
  cloud:
    aws:
      sns:
        enabled: false
      sqs:
        enabled: false

springdoc:
  api-docs:
    enabled: true
  swagger-ui:
    enabled: true
