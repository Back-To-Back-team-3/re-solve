spring:
  application:
    name: contest-service
  jpa:
    open-in-view: false
    show-sql: false
    hibernate:
      ddl-auto: validate
  flyway:
    enabled: true
    clean-disabled: true
  mvc:
    log-request-details: false

management:
  endpoints:
    web:
      exposure:
        include: health
  endpoint:
    health:
      show-details: never

logging:
  pattern:
    level: "%5p [correlationId=%X{correlationId:-}]"

springdoc:
  api-docs:
    enabled: false
  swagger-ui:
    enabled: false
