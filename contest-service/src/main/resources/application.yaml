spring:
  application:
    name: contest-service
  jpa:
    open-in-view: false
    show-sql: false
    hibernate:
      ddl-auto: validate
  flyway:
    enabled: true
    clean-disabled: true
  mvc:
    log-request-details: false

management:
  endpoints:
    web:
      exposure:
        include: health
  endpoint:
    health:
      show-details: never

logging:
  pattern:
    level: "%5p [correlationId=%X{correlationId:-}]"

springdoc:
  api-docs:
    enabled: false
  swagger-ui:
    enabled: false

contest:
  exam-dependencies:
    study-base-url: ${STUDY_SERVICE_URL:http://study-service:8080}
    problem-base-url: ${PROBLEM_SERVICE_URL:http://problem-service:8080}
  exam-run:
    base-url: ${JUDGE_SERVICE_URL:http://judge-service:8080}
  member:
    base-url: ${MEMBER_SERVICE_URL:http://member-service:8080}
  events:
    enabled: ${CONTEST_EVENTS_ENABLED:false}
    publish-enabled: ${CONTEST_EVENTS_PUBLISH_ENABLED:false}
    topic-arn: ${CONTEST_EVENTS_TOPIC_ARN:}
    submission-queue-url: ${JUDGE_SUBMISSION_QUEUE_URL:}
    queue-url: ${CONTEST_QUEUE_URL:}
