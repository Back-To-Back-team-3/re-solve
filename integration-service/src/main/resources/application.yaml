server:
  port: ${SERVER_PORT:8080}

spring:
  application:
    name: integration-service
  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:mysql://${DB_HOST:localhost}:${DB_PORT:3308}/integration_db?serverTimezone=Asia/Seoul&characterEncoding=UTF-8}
    username: ${DB_USERNAME:root}
    password: ${DB_PASSWORD:}
    driver-class-name: com.mysql.cj.jdbc.Driver
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        format_sql: true
        jdbc:
          time_zone: Asia/Seoul
  flyway:
    enabled: true
    locations: classpath:db/migration
  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}
      password: ${REDIS_PASSWORD:}
  jackson:
    time-zone: Asia/Seoul

integration:
  crypto:
    secret-key: ${INTEGRATION_CRYPTO_SECRET_KEY}
  github:
    app-id: ${GITHUB_APP_ID:}
    app-slug: ${GITHUB_APP_SLUG:resolve-sync}
    private-key: ${GITHUB_APP_PRIVATE_KEY:}
    api-base-url: ${GITHUB_API_BASE_URL:https://api.github.com}
    state-ttl-seconds: 600

logging:
  pattern:
    level: "%5p [correlationId=%X{correlationId:-}]"
  level:
    com.backtoback.integration: INFO

---
spring:
  config:
    activate:
      on-profile: local

logging:
  level:
    com.backtoback.integration: DEBUG
