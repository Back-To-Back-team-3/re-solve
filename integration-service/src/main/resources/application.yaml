server:
  port: ${SERVER_PORT:8080}

spring:
  application:
    name: integration-service
  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:mysql://${DB_HOST:localhost}:${DB_PORT:3308}/integration_db?serverTimezone=Asia/Seoul&characterEncoding=UTF-8}
    username: ${DB_USERNAME:root}
    password: ${DB_PASSWORD:}
    driver-class-name: com.mysql.cj.jdbc.Driver
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        format_sql: true
        jdbc:
          time_zone: Asia/Seoul
  flyway:
    enabled: true
    locations: classpath:db/migration
  jackson:
    time-zone: Asia/Seoul

integration:
  crypto:
    secret-key: ${INTEGRATION_CRYPTO_SECRET_KEY:0123456789abcdef0123456789abcdef}

logging:
  pattern:
    level: "%5p [correlationId=%X{correlationId:-}]"
  level:
    com.backtoback.integration: DEBUG
