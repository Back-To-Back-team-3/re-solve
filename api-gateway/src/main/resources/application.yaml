server:
  port: 8080

spring:
  application:
    name: api-gateway
  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}
      password: ${REDIS_PASSWORD:}
  cloud:
    gateway:
      routes:
        # notification-service (SSE Subscribe: streaming long-lived connection)
        - id: notification-sse-service
          uri: ${NOTIFICATION_SERVICE_URL:http://notification-service:8080}
          predicates:
            - Path=/api/v1/notifications/subscribe
          metadata:
            response-timeout: -1

        # notification-service (General)
        - id: notification-service
          uri: ${NOTIFICATION_SERVICE_URL:http://notification-service:8080}
          predicates:
            - Path=/api/v1/notifications/**

        # member-service
        - id: member-service
          uri: ${MEMBER_SERVICE_URL:http://member-service:8080}
          predicates:
            - Path=/api/v1/auth/**, /api/v1/members/**, /api/v1/diagnoses/**, /api/v1/admin/members/**

        # problem-service
        - id: problem-service
          uri: ${PROBLEM_SERVICE_URL:http://problem-service:8080}
          predicates:
            - Path=/api/v1/problems/**, /api/v1/solution-shares/**, /api/v1/admin/problems/**

        # judge-service
        - id: judge-service
          uri: ${JUDGE_SERVICE_URL:http://judge-service:8080}
          predicates:
            - Path=/api/v1/judge/**, /api/v1/submissions/**, /api/v1/runs/**, /api/v1/me/submissions/**, /api/v1/admin/judge-jobs/**, /api/v1/admin/submissions/**

        # contest-service
        - id: contest-service
          uri: ${CONTEST_SERVICE_URL:http://contest-service:8080}
          predicates:
            - Path=/api/v1/exams/**, /api/v1/contests/**, /api/v1/admin/exams/**, /api/v1/admin/contests/**, /api/v1/admin/exam-submissions/**, /api/v1/admin/contest-submissions/**, /api/v1/admin/contest-operations/**

        # study-service
        - id: study-service
          uri: ${STUDY_SERVICE_URL:http://study-service:8080}
          predicates:
            - Path=/api/v1/studies/**, /api/v1/admin/studies/**

        # integration-service
        - id: integration-service
          uri: ${INTEGRATION_SERVICE_URL:http://integration-service:8080}
          predicates:
            - Path=/api/v1/integrations/**

        # ai-service
        - id: ai-service
          uri: ${AI_SERVICE_URL:http://ai-service:8080}
          predicates:
            - Path=/api/v1/hint-requests/**

        # analytics-service
        - id: analytics-service
          uri: ${ANALYTICS_SERVICE_URL:http://analytics-service:8080}
          predicates:
            - Path=/api/v1/analytics/**

      globalcors:
        cors-configurations:
          '[/**]':
            allowed-origin-patterns:
              - ${FRONTEND_ORIGIN:http://localhost:8080}
              - http://localhost:3000
              - http://localhost:8080
              - https://*.netlify.app
            allowed-methods:
              - GET
              - POST
              - PUT
              - PATCH
              - DELETE
              - OPTIONS
            allowed-headers:
              - "*"
            exposed-headers:
              - Authorization
              - X-Correlation-Id
            allow-credentials: true
            max-age: 3600

management:
  endpoints:
    web:
      exposure:
        include: health, info
  endpoint:
    health:
      show-details: when_authorized

resolve:
  auth:
    jwt-secret: ${JWT_SECRET:}
    bypass-enabled: ${AUTH_BYPASS_ENABLED:false}
