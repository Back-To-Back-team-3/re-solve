spring:
  application:
    name: problem-service
  task:
    scheduling:
      pool:
        # Outbox 발행 1개와 자산·태그·발행 기록·소비 기록 정리 4개가 서로 기다리지 않도록 한다.
        size: 5
  datasource:
    url: ${SPRING_DATASOURCE_URL}
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}
  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}
      password: ${REDIS_PASSWORD:}
      connect-timeout: 2s
      timeout: 2s
  jpa:
    open-in-view: false
    show-sql: false
    hibernate:
      ddl-auto: validate
  flyway:
    enabled: true
    locations: classpath:db/migration
    clean-disabled: true
  cloud:
    aws:
      region:
        static: ${AWS_REGION:ap-northeast-2}
  mvc:
    log-request-details: false
  servlet:
    multipart:
      max-file-size: 5242880B
      max-request-size: -1

management:
  endpoints:
    web:
      exposure:
        include: health
  endpoint:
    health:
      show-details: never

logging:
  pattern:
#    level: "%5p [%X{correlationId:-}]"
    level: "%5p [correlationId=%X{correlationId:-}]"
  level:
    org.springframework.web: INFO
    org.springframework.security: INFO
    org.hibernate.SQL: INFO
    org.hibernate.orm.jdbc.bind: INFO

problem:
  integration:
    judge-url: ${JUDGE_SERVICE_URL:http://judge-service:8080}
    topic-arn: ${PROBLEM_EVENTS_TOPIC_ARN:}
  messaging:
    validation-queue-url: ${PROBLEM_VALIDATION_QUEUE_URL:}
  image-storage:
    bucket: ${PROBLEM_S3_BUCKET:}
  tag-idempotency:
    cleanup:
      enabled: true
