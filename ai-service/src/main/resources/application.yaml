spring:
  application:
    name: ai-service
  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}
      password: ${REDIS_PASSWORD:}
  cloud:
    aws:
      region:
        static: ${AWS_REGION:ap-northeast-2}
  ai:
    openai:
      api-key: ${OPENAI_API_KEY:}
      chat:
        options:
          model: gpt-4o

ai:
  sqs:
    queue-name: ${AI_SQS_QUEUE_NAME:ai-queue}

logging:
  pattern:
    level: "%5p [correlationId=%X{correlationId:-}]"
