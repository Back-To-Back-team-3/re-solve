x-backend-build: &backend-build
  dockerfile: ../Dockerfile

x-db-environment: &db-environment
  SPRING_PROFILES_ACTIVE: ${SPRING_PROFILES_ACTIVE:-local}
  SPRING_DATASOURCE_USERNAME: ${DB_USERNAME:?DB_USERNAME is required}
  SPRING_DATASOURCE_PASSWORD: ${DB_PASSWORD:?DB_PASSWORD is required}

x-db-redis-environment: &db-redis-environment
  <<: *db-environment
  SPRING_DATA_REDIS_HOST: ${REDIS_HOST:-redis}
  SPRING_DATA_REDIS_PORT: ${REDIS_PORT:-6379}
  SPRING_DATA_REDIS_PASSWORD: ${REDIS_PASSWORD:?REDIS_PASSWORD is required}

services:
  nginx:
    image: ${NGINX_IMAGE:-nginx:stable-alpine}
    restart: unless-stopped
    ports:
      - "${NGINX_BIND_ADDRESS:-127.0.0.1}:${NGINX_HTTP_PORT:-8080}:80"
      - "${NGINX_BIND_ADDRESS:-127.0.0.1}:${NGINX_HTTPS_PORT:-8443}:443"
    volumes:
      - ${NGINX_CONFIG_FILE:-./nginx/local.conf}:/etc/nginx/conf.d/default.conf:ro
      - ${NGINX_CERTS_DIR:-./nginx/certs}:/etc/letsencrypt:ro
      - ${NGINX_CHALLENGE_DIR:-./nginx/certbot}:/var/www/certbot:ro
    depends_on:
      - api-gateway

  # 로컬에서만 실행한다.
  frontend:
    profiles: [local]
    build:
      context: ./frontend
      args:
        NGINX_IMAGE: ${NGINX_IMAGE:-nginx:stable-alpine}
    image: re-solve-frontend:${IMAGE_TAG:-local}

  mysql:
    image: ${MYSQL_IMAGE:-mysql:8.4}
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:?MYSQL_ROOT_PASSWORD is required}
      MYSQL_DATABASE: member_db
      MYSQL_USER: ${DB_USERNAME:?DB_USERNAME is required}
      MYSQL_PASSWORD: ${DB_PASSWORD:?DB_PASSWORD is required}
    ports:
      - "127.0.0.1:${MYSQL_HOST_PORT:-3308}:3306"
    volumes:
      - mysql-data:/var/lib/mysql
      - ./init-scripts/init-db.sh:/docker-entrypoint-initdb.d/init-db.sh:ro
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h 127.0.0.1 --silent"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s


  redis:
    image: ${REDIS_IMAGE:-redis:7.4-alpine}
    environment:
      REDISCLI_AUTH: ${REDIS_PASSWORD:?REDIS_PASSWORD is required}
    command:
      - redis-server
      - --appendonly
      - "yes"
      - --requirepass
      - ${REDIS_PASSWORD:?REDIS_PASSWORD is required}
    ports:
      - "127.0.0.1:${REDIS_HOST_PORT:-6380}:6379"
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  localstack:
    image: ${LOCALSTACK_IMAGE:-localstack/localstack:3.8}
    ports:
      - "127.0.0.1:${LOCALSTACK_HOST_PORT:-4566}:4566"
    environment:
      SERVICES: "s3,sqs,sns"
      AWS_DEFAULT_REGION: ${AWS_REGION:-ap-northeast-2}
    volumes:
      - localstack-data:/var/lib/localstack
      - ./init-aws/init-aws.sh:/etc/localstack/init/ready.d/init-aws.sh:ro
    healthcheck:
      test: ["CMD-SHELL", "awslocal sqs list-queues > /dev/null 2>&1 && curl -sf http://127.0.0.1:4566/_localstack/init/ready | grep -q '\"state\": \"SUCCESSFUL\"'"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 15s

  api-gateway:
    image: ${DOCKERHUB_USERNAME:-local-re-solve}/re-solve-api-gateway:${IMAGE_TAG:-local}
    build:
      <<: *backend-build
      context: ./api-gateway
    environment:
      SPRING_PROFILES_ACTIVE: ${SPRING_PROFILES_ACTIVE:-local}
      MEMBER_SERVICE_URL: ${MEMBER_SERVICE_URL:-http://member-service:8080}
      PROBLEM_SERVICE_URL: ${PROBLEM_SERVICE_URL:-http://problem-service:8080}
      JUDGE_SERVICE_URL: ${JUDGE_SERVICE_URL:-http://judge-service:8080}
      CONTEST_SERVICE_URL: ${CONTEST_SERVICE_URL:-http://contest-service:8080}
      STUDY_SERVICE_URL: ${STUDY_SERVICE_URL:-http://study-service:8080}
      NOTIFICATION_SERVICE_URL: ${NOTIFICATION_SERVICE_URL:-http://notification-service:8080}
      INTEGRATION_SERVICE_URL: ${INTEGRATION_SERVICE_URL:-http://integration-service:8080}
      AI_SERVICE_URL: ${AI_SERVICE_URL:-http://ai-service:8080}
      ANALYTICS_SERVICE_URL: ${ANALYTICS_SERVICE_URL:-http://analytics-service:8080}

  member-service:
    image: ${DOCKERHUB_USERNAME:-local-re-solve}/re-solve-member-service:${IMAGE_TAG:-local}
    build:
      <<: *backend-build
      context: ./member-service
    environment:
      <<: *db-redis-environment
      SPRING_DATASOURCE_URL: jdbc:mysql://${DB_HOST:-mysql}:${DB_PORT:-3306}/member_db
      GITHUB_CLIENT_ID: ${GITHUB_CLIENT_ID:?GITHUB_CLIENT_ID is required}
      GITHUB_CLIENT_SECRET: ${GITHUB_CLIENT_SECRET:?GITHUB_CLIENT_SECRET is required}
      GITHUB_REDIRECT_URI: ${GITHUB_REDIRECT_URI:-http://localhost:8080/api/v1/auth/github/callback}
      FRONTEND_ORIGIN: ${FRONTEND_ORIGIN:-http://localhost:8080}
      JWT_SECRET: ${JWT_SECRET:?JWT_SECRET is required}
      REFRESH_COOKIE_SECURE: ${REFRESH_COOKIE_SECURE:-true}
    depends_on:
      mysql:
        condition: service_healthy
      redis:
        condition: service_healthy

  problem-service:
    image: ${DOCKERHUB_USERNAME:-local-re-solve}/re-solve-problem-service:${IMAGE_TAG:-local}
    build:
      <<: *backend-build
      context: ./problem-service
    environment:
      <<: *db-environment
      SPRING_DATASOURCE_URL: jdbc:mysql://${DB_HOST:-mysql}:${DB_PORT:-3306}/problem_db
      AWS_REGION: ${AWS_REGION:-ap-northeast-2}
    depends_on:
      mysql:
        condition: service_healthy

  judge-service:
    image: ${DOCKERHUB_USERNAME:-local-re-solve}/re-solve-judge-service:${IMAGE_TAG:-local}
    build:
      <<: *backend-build
      context: ./judge-service
    environment:
      <<: *db-redis-environment
      SPRING_DATASOURCE_URL: jdbc:mysql://${DB_HOST:-mysql}:${DB_PORT:-3306}/judge_db
      AWS_REGION: ${AWS_REGION:-ap-northeast-2}
      JUDGE0_BASE_URL: ${JUDGE0_BASE_URL:-}
    depends_on:
      mysql:
        condition: service_healthy
      redis:
        condition: service_healthy

  contest-service:
    image: ${DOCKERHUB_USERNAME:-local-re-solve}/re-solve-contest-service:${IMAGE_TAG:-local}
    build:
      <<: *backend-build
      context: ./contest-service
    environment:
      <<: *db-redis-environment
      SPRING_DATASOURCE_URL: jdbc:mysql://${DB_HOST:-mysql}:${DB_PORT:-3306}/contest_db
      AWS_REGION: ${AWS_REGION:-ap-northeast-2}
    depends_on:
      mysql:
        condition: service_healthy
      redis:
        condition: service_healthy

  study-service:
    image: ${DOCKERHUB_USERNAME:-local-re-solve}/re-solve-study-service:${IMAGE_TAG:-local}
    build:
      <<: *backend-build
      context: ./study-service
    environment:
      <<: *db-environment
      SPRING_DATASOURCE_URL: jdbc:mysql://${DB_HOST:-mysql}:${DB_PORT:-3306}/study_db
    depends_on:
      mysql:
        condition: service_healthy

  notification-service:
    image: ${DOCKERHUB_USERNAME:-local-re-solve}/re-solve-notification-service:${IMAGE_TAG:-local}
    build:
      <<: *backend-build
      context: ./notification-service
    environment:
      <<: *db-environment
      SPRING_DATASOURCE_URL: jdbc:mysql://${DB_HOST:-mysql}:${DB_PORT:-3306}/notification_db
      AWS_REGION: ${AWS_REGION:-ap-northeast-2}
    depends_on:
      mysql:
        condition: service_healthy

  integration-service:
    image: ${DOCKERHUB_USERNAME:-local-re-solve}/re-solve-integration-service:${IMAGE_TAG:-local}
    build:
      <<: *backend-build
      context: ./integration-service
    environment:
      <<: *db-environment
      SPRING_DATASOURCE_URL: jdbc:mysql://${DB_HOST:-mysql}:${DB_PORT:-3306}/integration_db
    depends_on:
      mysql:
        condition: service_healthy

  ai-service:
    image: ${DOCKERHUB_USERNAME:-local-re-solve}/re-solve-ai-service:${IMAGE_TAG:-local}
    build:
      <<: *backend-build
      context: ./ai-service
    environment:
      <<: *db-redis-environment
      SPRING_DATASOURCE_URL: jdbc:mysql://${DB_HOST:-mysql}:${DB_PORT:-3306}/ai_db
    depends_on:
      mysql:
        condition: service_healthy
      redis:
        condition: service_healthy

  analytics-service:
    image: ${DOCKERHUB_USERNAME:-local-re-solve}/re-solve-analytics-service:${IMAGE_TAG:-local}
    build:
      <<: *backend-build
      context: ./analytics-service
    environment:
      <<: *db-environment
      SPRING_DATASOURCE_URL: jdbc:mysql://${DB_HOST:-mysql}:${DB_PORT:-3306}/analytics_db
    depends_on:
      mysql:
        condition: service_healthy

volumes:
  mysql-data:
  redis-data:
  localstack-data:
