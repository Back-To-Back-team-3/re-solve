groups:
  - name: re-solve-infrastructure-alerts
    rules:
      - alert: ServiceDown
        expr: up == 0
        for: 1m
        labels:
          severity: critical
        annotations:
          summary: "서비스 인스턴스 중단 감지: {{ $labels.job }}"
          description: "{{ $labels.job }} ({{ $labels.instance }}) 인스턴스가 1분 이상 응답하지 않습니다."

      - alert: OutboxPendingAccumulation
        expr: outbox_pending_count > 100
        for: 3m
        labels:
          severity: warning
        annotations:
          summary: "Outbox Relay 미발행 적체 경보"
          description: "Outbox 미발행(PENDING) 이벤트 건수가 3분 이상 100건을 초과했습니다. 현재 건수: {{ $value }}"

      - alert: SqsQueueMetricsStale
        expr: time() - aws_sqs_metrics_last_success_timestamp_seconds > 120
        for: 1m
        labels:
          severity: warning
        annotations:
          summary: "SQS 큐 메트릭 갱신 중단: {{ $labels.queue }}"
          description: "SQS 큐 {{ $labels.queue }}의 메트릭 조회가 2분 이상 성공하지 못했습니다. 적체 경보 값을 신뢰할 수 없습니다."

      - alert: SqsQueueAccumulation
        expr: aws_sqs_messages_visible > 50
        for: 2m
        labels:
          severity: warning
        annotations:
          summary: "SQS 큐 대기 메시지 적체 경보: {{ $labels.queue }}"
          description: "SQS 큐 {{ $labels.queue }}의 대기 메시지가 2분 이상 50건을 초과했습니다. 현재 대기량: {{ $value }}"

      - alert: SqsQueueCriticalAccumulation
        expr: aws_sqs_messages_visible > 200
        for: 1m
        labels:
          severity: critical
        annotations:
          summary: "SQS 큐 대기 메시지 심각 적체 경보: {{ $labels.queue }}"
          description: "SQS 큐 {{ $labels.queue }}의 대기 메시지가 1분 이상 200건을 초과했습니다. 컨슈머 장애 또는 병목 여부를 확인하세요. 현재 대기량: {{ $value }}"

      - alert: GithubRateLimitLow
        expr: github_ratelimit_remaining < 500
        for: 1m
        labels:
          severity: warning
        annotations:
          summary: "GitHub API Rate Limit 잔여량 부족 경보"
          description: "GitHub API 잔여 할당량이 500회 미만입니다. 현재 잔여량: {{ $value }}"

      - alert: GithubRateLimitExhausted
        expr: github_ratelimit_remaining < 50
        for: 30s
        labels:
          severity: critical
        annotations:
          summary: "GitHub API Rate Limit 소진 임박 경보"
          description: "GitHub API 잔여 할당량이 50회 미만으로 소진 직전입니다. 즉시 Sync 작업 상태를 확인하세요. 현재 잔여량: {{ $value }}"

      - alert: HighHttp5xxErrorRate
        expr: sum(rate(http_server_requests_seconds_count{status=~"5.."}[1m])) by (application) / sum(rate(http_server_requests_seconds_count[1m])) by (application) * 100 > 5
        for: 2m
        labels:
          severity: critical
        annotations:
          summary: "HTTP 5xx 응답률 급증: {{ $labels.application }}"
          description: "{{ $labels.application }} 서비스의 HTTP 5xx 에러율이 2분 동안 5%를 초과했습니다."
