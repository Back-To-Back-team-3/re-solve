spring:
  application:
    name: study-service
  datasource:
    url: ${SPRING_DATASOURCE_URL}
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
  flyway:
    enabled: true
    locations: classpath:db/migration
    clean-disabled: true
  data:
    redis:
      host: ${REDIS_HOST:redis}
      port: ${REDIS_PORT:6379}
      password: ${SPRING_DATA_REDIS_PASSWORD:${REDIS_PASSWORD:}}
  jackson:
    time-zone: Asia/Seoul

logging:
  pattern:
    level: "%5p [correlationId=%X{correlationId:-}]"

study:
  sqs:
    queue-name: ${STUDY_SQS_QUEUE_NAME:study-queue}
  hint-context-client:
    problem-base-url: ${PROBLEM_SERVICE_URL:http://problem-service:8080}
  judge-client:
    base-url: ${JUDGE_SERVICE_URL:http://judge-service:8080}

springdoc:
  api-docs:
    enabled: false
  swagger-ui:
    enabled: false
