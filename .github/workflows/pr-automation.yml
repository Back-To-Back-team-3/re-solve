name: PR Automation

on:
  pull_request:
    types: [opened, edited, synchronize, ready_for_review, reopened, stacked, labeled, unlabeled, closed]

permissions:
  contents: read
  issues: write
  pull-requests: write

concurrency:
  group: pr-${{ github.event.pull_request.number }}
  cancel-in-progress: false
  queue: max

jobs:
  sync-pr:
    if: github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ github.token }}
      REVIEWERS: ${{ vars.PR_REVIEWERS }}
      PROJECT_TOKEN: ${{ secrets.PROJECT_TOKEN }}
      PROJECT_OWNER: ${{ vars.PROJECT_OWNER }}
      PROJECT_NUMBER: ${{ vars.PROJECT_NUMBER }}
      PROJECT_CODE_SIZE_FIELD: ${{ vars.PROJECT_CODE_SIZE_FIELD }}
      PROJECT_STATUS_FIELD: ${{ vars.PROJECT_STATUS_FIELD }}
      PROJECT_DONE_VALUE: ${{ vars.PROJECT_DONE_VALUE }}
    steps:
      - name: 담당자·라벨·리뷰어 설정
        shell: bash
        run: |
          set -euo pipefail

          pr_number="$(jq -r '.pull_request.number' "$GITHUB_EVENT_PATH")"
          author="$(jq -r '.pull_request.user.login' "$GITHUB_EVENT_PATH")"
          title="$(jq -r '.pull_request.title' "$GITHUB_EVENT_PATH")"
          draft="$(jq -r '.pull_request.draft' "$GITHUB_EVENT_PATH")"
          stack_position="$(jq -r '.pull_request.stack.position // 0' "$GITHUB_EVENT_PATH")"
          stack_base="$(jq -r '.pull_request.stack.base.ref // ""' "$GITHUB_EVENT_PATH")"
          action="${{ github.event.action }}"
          repo="$GITHUB_REPOSITORY"

          if [ "$action" = "opened" ]; then
            gh pr edit "$pr_number" --repo "$repo" --add-assignee "$author" || true
          fi

          case "$title" in
            feat\(*) label="💫 feat" ;;
            fix\(*) label="🐛 fix" ;;
            chore\(*) label="⚙️ chore" ;;
            docs\(*) label="📝 docs" ;;
            refactor\(*) label="♻️ refactor" ;;
            test\(*) label="✅ test" ;;
            *) label="" ;;
          esac

          if [ -n "$label" ] && { [ "$action" = "opened" ] || [ "$action" = "edited" ]; }; then
            current_labels="$(jq -r '.pull_request.labels[]?.name' "$GITHUB_EVENT_PATH")"
            if ! grep -Fxq "$label" <<< "$current_labels"; then
              gh issue edit "$pr_number" --repo "$repo" --add-label "$label"
            fi
            for old_label in "💫 feat" "🐛 fix" "⚙️ chore" "📝 docs" "♻️ refactor" "✅ test"; do
              if [ "$old_label" != "$label" ] && grep -Fxq "$old_label" <<< "$current_labels"; then
                gh issue edit "$pr_number" --repo "$repo" --remove-label "$old_label"
              fi
            done
          fi

          if [ "$action" != "closed" ]; then
            stack_label="🧱 stack"
            has_stack_label="$(jq -r --arg name "$stack_label" 'any(.pull_request.labels[]?; .name == $name)' "$GITHUB_EVENT_PATH")"
            if [ "$stack_position" -gt 1 ] && { [ "$stack_base" = "develop" ] || [ "$stack_base" = "main" ]; }; then
              if [ "$has_stack_label" != "true" ]; then
                gh issue edit "$pr_number" --repo "$repo" --add-label "$stack_label"
              fi
            elif [ "$has_stack_label" = "true" ]; then
              gh issue edit "$pr_number" --repo "$repo" --remove-label "$stack_label"
            fi
          fi

          if [ "$draft" = "false" ] && { [ "$action" = "opened" ] || [ "$action" = "ready_for_review" ] || [ "$action" = "reopened" ]; }; then
            reviewers=()
            IFS=',' read -ra configured <<< "$REVIEWERS"
            for reviewer in "${configured[@]}"; do
              reviewer="${reviewer//[[:space:]]/}"
              if [ -n "$reviewer" ] && [ "$reviewer" != "$author" ]; then
                reviewers+=("$reviewer")
              fi
            done
            if [ "${#reviewers[@]}" -gt 0 ]; then
              reviewer_csv="$(IFS=,; echo "${reviewers[*]}")"
              gh pr edit "$pr_number" --repo "$repo" --add-reviewer "$reviewer_csv"
            fi
          fi

      - name: GitHub Project 동기화
        if: env.PROJECT_TOKEN != '' && env.PROJECT_OWNER != '' && env.PROJECT_NUMBER != '' && (github.event.action == 'opened' || github.event.action == 'reopened' || github.event.action == 'synchronize' || (github.event.action == 'closed' && github.event.pull_request.merged))
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.PROJECT_TOKEN }}
        run: |
          set -euo pipefail

          pr_url="$(jq -r '.pull_request.html_url' "$GITHUB_EVENT_PATH")"
          action="${{ github.event.action }}"
          merged="$(jq -r '.pull_request.merged // false' "$GITHUB_EVENT_PATH")"
          additions="$(jq -r '.pull_request.additions // 0' "$GITHUB_EVENT_PATH")"
          deletions="$(jq -r '.pull_request.deletions // 0' "$GITHUB_EVENT_PATH")"
          changed_lines=$((additions + deletions))

          if [ "$action" = "closed" ] && [ "$merged" != "true" ]; then
            exit 0
          fi

          project_id="$(gh project view "$PROJECT_NUMBER" --owner "$PROJECT_OWNER" --format json --jq '.id')"
          item_id="$(gh project item-add "$PROJECT_NUMBER" --owner "$PROJECT_OWNER" --url "$pr_url" --format json --jq '.id')"
          fields_json="$(gh project field-list "$PROJECT_NUMBER" --owner "$PROJECT_OWNER" --limit 100 --format json)"

          set_choice() {
            local field_id option_id
            field_id="$(jq -r --arg name "$1" '.fields[] | select(.name == $name) | .id' <<< "$fields_json")"
            option_id="$(jq -r --arg name "$1" --arg value "$2" \
              '.fields[] | select(.name == $name) | .options[]? | select(.name == $value) | .id' <<< "$fields_json")"
            if [ -z "$field_id" ] || [ -z "$option_id" ]; then
              echo "Project 필드 또는 선택지를 찾을 수 없습니다: $1 / $2" >&2
              exit 1
            fi
            gh project item-edit --id "$item_id" --project-id "$project_id" \
              --field-id "$field_id" --single-select-option-id "$option_id"
          }

          if [ -n "$PROJECT_CODE_SIZE_FIELD" ] && [ "$action" != "closed" ]; then
            if [ "$changed_lines" -ge 401 ]; then size="🦑 Large"
            elif [ "$changed_lines" -ge 101 ]; then size="🐂 Medium"
            elif [ "$changed_lines" -ge 21 ]; then size="🐇 Small"
            else size="🦔 Tiny"; fi
            set_choice "$PROJECT_CODE_SIZE_FIELD" "$size"
          fi

          if [ "$action" = "closed" ] && [ "$merged" = "true" ] && [ -n "$PROJECT_STATUS_FIELD" ] && [ -n "$PROJECT_DONE_VALUE" ]; then
            set_choice "$PROJECT_STATUS_FIELD" "$PROJECT_DONE_VALUE"
          fi
