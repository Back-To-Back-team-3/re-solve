name: Environment Control

on:
  workflow_dispatch:
    inputs:
      environment:
        description: '제어 대상 환경'
        required: true
        default: 'staging'
        type: choice
        options:
          - staging
          - production
      action:
        description: '수행할 동작'
        required: true
        default: 'status'
        type: choice
        options:
          - status
          - start
          - stop
          - restart
      services:
        description: '대상 서비스 (공백으로 구분, 미입력 시 all)'
        required: false
        default: 'all'
        type: string
      force:
        description: '강제 중단 여부 (stop/restart 시 신속 중단)'
        required: false
        default: false
        type: boolean

  # 스테이징 환경 비용 절감을 위한 야간 자동 중단 (매일 KST 00:00 = UTC 15:00)
  schedule:
    - cron: '0 15 * * *'

permissions:
  contents: read

jobs:
  control:
    runs-on: ubuntu-24.04
    concurrency:
      group: env-control-${{ github.event.inputs.environment || 'staging' }}
      cancel-in-progress: false
    steps:
      - name: 제어 파라미터 결정
        id: params
        run: |
          if [ "${{ github.event_name }}" = "schedule" ]; then
            TARGET_ENV="staging"
            TARGET_ACTION="stop"
            TARGET_SERVICES="all"
            FORCE_OPT=""
            echo "⏰ [Schedule] 야간 스테이징 자동 중단 스케줄 트리거 실행"
          else
            TARGET_ENV="${{ github.event.inputs.environment }}"
            TARGET_ACTION="${{ github.event.inputs.action }}"
            TARGET_SERVICES="${{ github.event.inputs.services || 'all' }}"
            if [ "${{ github.event.inputs.force }}" = "true" ]; then
              FORCE_OPT="--force"
            else
              FORCE_OPT=""
            fi
          fi

          echo "target_env=$TARGET_ENV" >> $GITHUB_OUTPUT
          echo "target_action=$TARGET_ACTION" >> $GITHUB_OUTPUT
          echo "target_services=$TARGET_SERVICES" >> $GITHUB_OUTPUT
          echo "force_opt=$FORCE_OPT" >> $GITHUB_OUTPUT

          echo "=========================================================="
          echo "🛠️ 환경 제어 실행 설정"
          echo "  - 환경: $TARGET_ENV"
          echo "  - 동작: $TARGET_ACTION"
          echo "  - 대상 서비스: $TARGET_SERVICES"
          echo "  - 옵션: $FORCE_OPT"
          echo "=========================================================="

      - name: EC2 원격 제어 스크립트 실행 (SSH)
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ steps.params.outputs.target_env == 'production' && secrets.PROD_EC2_HOST || secrets.STAGING_EC2_HOST }}
          username: ${{ steps.params.outputs.target_env == 'production' && secrets.PROD_EC2_USER || secrets.STAGING_EC2_USER }}
          key: ${{ steps.params.outputs.target_env == 'production' && secrets.PROD_EC2_SSH_KEY || secrets.STAGING_EC2_SSH_KEY }}
          port: 22
          script: |
            set -eo pipefail
            APP_DIR="${{ steps.params.outputs.target_env == 'production' && (secrets.PROD_APP_DIR || '/home/ubuntu/re-solve') || (secrets.STAGING_APP_DIR || '/home/ubuntu/re-solve') }}"
            cd "$APP_DIR"

            echo "📥 저장소 코드 최신화 확인..."
            git fetch origin
            BRANCH="${{ steps.params.outputs.target_env == 'production' && 'main' || 'develop' }}"
            git checkout "$BRANCH"
            git pull origin "$BRANCH"

            echo "🚀 서비스 제어 스크립트 실행..."
            chmod +x ./scripts/deploy/*.sh
            ./scripts/deploy/service-control.sh "${{ steps.params.outputs.target_action }}" ${{ steps.params.outputs.force_opt }} ${{ steps.params.outputs.target_services }}
