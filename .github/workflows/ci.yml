name: CI

on:
  pull_request:

permissions:
  contents: read

jobs:
  quality-check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '21'

      - name: 코드 형식과 테스트 소스 컴파일
        run: bash ./gradlew spotlessCheck checkstyleMain checkstyleTest compileTestJava
