name: CD

on:
  workflow_run:
    workflows: ["Docker Build & Push"]
    types:
      - completed
    branches: [ develop, main ]
  workflow_dispatch:
    inputs:
      environment:
        description: '배포 환경'
        required: true
        default: 'staging'
        type: choice
        options:
          - staging
          - production
      services:
        description: '배포할 서비스 (공백으로 구분, 미입력 시 all)'
        required: false
        default: 'all'
        type: string

permissions:
  contents: read

jobs:
  deploy:
    if: ${{ github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success' }}
    runs-on: ubuntu-24.04
    steps:
      - name: 배포 환경 및 대상 서비스 결정
        id: env
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            TARGET_ENV="${{ github.event.inputs.environment }}"
            TARGET_SERVICES="${{ github.event.inputs.services }}"
          else
            if [ "${{ github.event.workflow_run.head_branch }}" = "main" ]; then
              TARGET_ENV="production"
            else
              TARGET_ENV="staging"
            fi
            TARGET_SERVICES="all"
          fi
          echo "target_env=$TARGET_ENV" >> $GITHUB_OUTPUT
          echo "target_services=$TARGET_SERVICES" >> $GITHUB_OUTPUT
          echo "🚀 배포 대상 환경: $TARGET_ENV"
          echo "🚀 배포 대상 서비스: $TARGET_SERVICES"

      - name: EC2 원격 배포 실행 (SSH)
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ steps.env.outputs.target_env == 'production' && secrets.PROD_EC2_HOST || secrets.STAGING_EC2_HOST }}
          username: ${{ steps.env.outputs.target_env == 'production' && secrets.PROD_EC2_USER || secrets.STAGING_EC2_USER }}
          key: ${{ steps.env.outputs.target_env == 'production' && secrets.PROD_EC2_SSH_KEY || secrets.STAGING_EC2_SSH_KEY }}
          port: 22
          script: |
            set -eo pipefail
            APP_DIR="${{ steps.env.outputs.target_env == 'production' && secrets.PROD_APP_DIR || secrets.STAGING_APP_DIR || '/home/ubuntu/re-solve' }}"
            cd "$APP_DIR"
            
            echo "📥 저장소 코드 갱신 중..."
            git fetch origin
            BRANCH="${{ github.event.workflow_run.head_branch || (steps.env.outputs.target_env == 'production' && 'main' || 'develop') }}"
            git checkout "$BRANCH"
            git pull origin "$BRANCH"

            echo "🚀 배포 스크립트 실행..."
            chmod +x ./scripts/deploy/*.sh
            ./scripts/deploy/deploy.sh ${{ steps.env.outputs.target_services }}
