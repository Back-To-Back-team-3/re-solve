name: Re:Solve Backend CD (ECS Fargate)

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:
    inputs:
      target_service:
        description: '배포할 서비스 선택 (전체 배포는 all)'
        required: true
        default: 'all'
        type: choice
        options:
          - all
          - api-gateway
          - member-service
          - problem-service
          - judge-service
          - contest-service
          - study-service
          - notification-service
          - integration-service
          - ai-service
          - analytics-service
      target_tag:
        description: '배포할 이미지 태그'
        required: false
        default: 'latest'

permissions:
  id-token: write  # AWS OIDC 연동 필수
  contents: read

env:
  AWS_REGION: ap-northeast-2
  AWS_ACCOUNT_ID: "179923444818"
  ECS_CLUSTER: "resolve-cluster"

jobs:
  build-and-deploy:
    name: Build & Deploy to AWS ECS
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'

      - name: Cache Gradle Dependencies
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: ${{ runner.os }}-gradle-${{ hashFiles('**/*.gradle*', '**/gradle-wrapper.properties') }}
          restore-keys: |
            ${{ runner.os }}-gradle-

      # 1. 전체 서비스 Jar 빌드
      - name: Grant execute permission for gradlew
        run: chmod +x ./gradlew

      - name: Build Spring Boot Jars
        run: ./gradlew bootJar -x test

      # 2. AWS OIDC 자격 증명 설정
      - name: Configure AWS Credentials via OIDC
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_DEPLOY_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      # 3. Amazon ECR 로그인
      - name: Login to Amazon ECR
        id: login-ecr
        uses: aws-actions/amazon-ecr-login@v2

      # 4. 루트 Dockerfile을 사용해 이미지 빌드(linux/amd64), ECR 푸시 및 ECS 서비스 롤링 배포
      - name: Build, Push to ECR & Update ECS Services
        env:
          ECR_REGISTRY: ${{ steps.login-ecr.outputs.registry }}
        run: |
          ALL_SERVICES=(
            "api-gateway"
            "member-service"
            "problem-service"
            "judge-service"
            "contest-service"
            "study-service"
            "notification-service"
            "integration-service"
            "ai-service"
            "analytics-service"
          )

          TARGET="${{ github.event.inputs.target_service || 'all' }}"
          TAG="${{ github.event.inputs.target_tag || 'latest' }}"

          if [ "$TARGET" == "all" ]; then
            SERVICES=("${ALL_SERVICES[@]}")
          else
            SERVICES=("$TARGET")
          fi

          for SERVICE in "${SERVICES[@]}"; do
            if [ ! -d "./$SERVICE" ]; then
              echo "⚠️ ./$SERVICE 디렉터리가 없어 건너뜁니다."
              continue
            fi

            IMAGE_REPO="${ECR_REGISTRY}/re-solve-${SERVICE}"
            echo "=========================================="
            echo "🚀 Building & Pushing $SERVICE (linux/amd64)..."
            echo "=========================================="

            docker build \
              --platform linux/amd64 \
              -t "${IMAGE_REPO}:${TAG}" \
              -t "${IMAGE_REPO}:${GITHUB_SHA}" \
              -f ./Dockerfile "./${SERVICE}"

            docker push "${IMAGE_REPO}:${TAG}"
            docker push "${IMAGE_REPO}:${GITHUB_SHA}"

            echo "🔄 Updating ECS Service: $SERVICE in cluster $ECS_CLUSTER..."
            aws ecs update-service \
              --region "${AWS_REGION}" \
              --cluster "${ECS_CLUSTER}" \
              --service "${SERVICE}" \
              --force-new-deployment > /dev/null || echo "⚠️ ECS 서비스 $SERVICE 업데이트 실패 (아직 생성되지 않았을 수 있음)"

            echo "✅ $SERVICE 처리 완료!"
          done
