name: Issue Automation

on:
  issues:
    types: [opened, edited, reopened]

permissions:
  contents: read
  issues: write

concurrency:
  group: issue-${{ github.event.issue.number }}
  cancel-in-progress: false
  queue: max

jobs:
  sync-issue:
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ github.token }}
      PROJECT_TOKEN: ${{ secrets.PROJECT_TOKEN }}
      PROJECT_OWNER: ${{ vars.PROJECT_OWNER }}
      PROJECT_NUMBER: ${{ vars.PROJECT_NUMBER }}
      PROJECT_PRIORITY_FIELD: ${{ vars.PROJECT_PRIORITY_FIELD }}
      PROJECT_SIZE_FIELD: ${{ vars.PROJECT_SIZE_FIELD }}
      PROJECT_START_DATE_FIELD: ${{ vars.PROJECT_START_DATE_FIELD }}
      PROJECT_DUE_DATE_FIELD: ${{ vars.PROJECT_DUE_DATE_FIELD }}
    steps:
      - name: 담당자와 종류 라벨 설정
        shell: bash
        run: |
          set -euo pipefail

          issue_number="$(jq -r '.issue.number' "$GITHUB_EVENT_PATH")"
          author="$(jq -r '.issue.user.login' "$GITHUB_EVENT_PATH")"
          title="$(jq -r '.issue.title' "$GITHUB_EVENT_PATH")"
          repo="$GITHUB_REPOSITORY"

          if [ "$GITHUB_EVENT_NAME" = "issues" ] && [ "${{ github.event.action }}" = "opened" ]; then
            gh issue edit "$issue_number" --repo "$repo" --add-assignee "$author" || true
          fi

          case "$title" in
            feat\(*) label="💫 feat" ;;
            fix\(*) label="🐛 fix" ;;
            chore\(*) label="⚙️ chore" ;;
            docs\(*) label="📝 docs" ;;
            refactor\(*) label="♻️ refactor" ;;
            test\(*) label="✅ test" ;;
            style\(*) label="🎨 style" ;;
            hotfix\(*) label="🚑 hotfix" ;;
            *) label="" ;;
          esac

          if [ -n "$label" ]; then
            current_labels="$(jq -r '.issue.labels[]?.name' "$GITHUB_EVENT_PATH")"
            if ! grep -Fxq "$label" <<< "$current_labels"; then
              gh issue edit "$issue_number" --repo "$repo" --add-label "$label"
            fi
            for old_label in "💫 feat" "🐛 fix" "⚙️ chore" "📝 docs" "♻️ refactor" "✅ test" "🎨 style" "🚑 hotfix"; do
              if [ "$old_label" != "$label" ] && grep -Fxq "$old_label" <<< "$current_labels"; then
                gh issue edit "$issue_number" --repo "$repo" --remove-label "$old_label"
              fi
            done
          fi

          body="$(jq -r '.issue.body // ""' "$GITHUB_EVENT_PATH")"
          priority=""
          for value in Urgent High Medium Low; do
            if grep -Eq "^- \\[[xX]\\] .* ${value}( |$)" <<< "$body"; then
              priority="$value"
              break
            fi
          done
          if [ -n "$priority" ]; then
            jq -n --arg value "$priority" \
              '{issue_field_values: [{field_id: 43680323, value: $value}]}' |
              gh api --method POST "repos/$repo/issues/$issue_number/issue-field-values" \
                -H "X-GitHub-Api-Version: 2026-03-10" --input - >/dev/null
          fi

      - name: GitHub Project 동기화
        if: env.PROJECT_TOKEN != '' && env.PROJECT_OWNER != '' && env.PROJECT_NUMBER != '' && (github.event.action == 'opened' || github.event.action == 'reopened' || (github.event.action == 'edited' && github.event.changes.body != null))
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.PROJECT_TOKEN }}
        run: |
          set -euo pipefail

          issue_url="$(jq -r '.issue.html_url' "$GITHUB_EVENT_PATH")"
          body="$(jq -r '.issue.body // ""' "$GITHUB_EVENT_PATH")"

          project_id="$(gh project view "$PROJECT_NUMBER" --owner "$PROJECT_OWNER" --format json --jq '.id')"
          item_id="$(gh project item-add "$PROJECT_NUMBER" --owner "$PROJECT_OWNER" --url "$issue_url" --format json --jq '.id')"
          fields_json="$(gh project field-list "$PROJECT_NUMBER" --owner "$PROJECT_OWNER" --limit 100 --format json)"

          field_id_for() {
            jq -r --arg name "$1" '.fields[] | select(.name == $name) | .id' <<< "$fields_json"
          }

          option_id_for() {
            jq -r --arg name "$1" --arg value "$2" \
              '.fields[] | select(.name == $name) | .options[]? | select(.name == $value) | .id' <<< "$fields_json"
          }

          set_choice() {
            local field_id option_id
            field_id="$(field_id_for "$1")"
            option_id="$(option_id_for "$1" "$2")"
            if [ -z "$field_id" ] || [ -z "$option_id" ]; then
              echo "Project 필드 또는 선택지를 찾을 수 없습니다: $1 / $2" >&2
              exit 1
            fi
            gh project item-edit --id "$item_id" --project-id "$project_id" \
              --field-id "$field_id" --single-select-option-id "$option_id"
          }

          set_date() {
            local field_id
            field_id="$(field_id_for "$1")"
            if [ -z "$field_id" ]; then
              echo "Project 필드를 찾을 수 없습니다: $1" >&2
              exit 1
            fi
            gh project item-edit --id "$item_id" --project-id "$project_id" \
              --field-id "$field_id" --date "$2"
          }

          selected() {
            printf '%s\n' "$body" | grep -Eq "^- \\[[xX]\\] .* $1( |$)"
          }

          priority=""
          for value in "🌋 Urgent" "🏔 High" "🏕 Medium" "🏝 Low"; do
            if selected "${value#* }"; then priority="$value"; break; fi
          done
          if [ -n "$priority" ] && [ -n "$PROJECT_PRIORITY_FIELD" ]; then
            set_choice "$PROJECT_PRIORITY_FIELD" "$priority"
          fi

          size=""
          for value in "🦑 Large" "🐂 Medium" "🐇 Small" "🦔 Tiny"; do
            if selected "${value#* }"; then size="$value"; break; fi
          done
          if [ -n "$size" ] && [ -n "$PROJECT_SIZE_FIELD" ]; then
            set_choice "$PROJECT_SIZE_FIELD" "$size"
          fi

          if [ -n "$PROJECT_START_DATE_FIELD" ]; then
            start_date="$(jq -r '.issue.created_at[0:10]' "$GITHUB_EVENT_PATH")"
            set_date "$PROJECT_START_DATE_FIELD" "$start_date"
          fi

          if [ -n "$PROJECT_DUE_DATE_FIELD" ]; then
            due_date="$(printf '%s\n' "$body" | sed -n '/^## 📅 완료 기한/,/^## /p' | grep -Eo '[0-9]{4}-[0-9]{2}-[0-9]{2}' | head -n 1 || true)"
            if [ -n "$due_date" ]; then
              set_date "$PROJECT_DUE_DATE_FIELD" "$due_date"
            fi
          fi
