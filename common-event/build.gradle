plugins {
    id 'java-library'
    id 'io.spring.dependency-management' version '1.1.7'
    id 'checkstyle'
}

group = 'com.backtoback'
version = '1.0-SNAPSHOT'

java {
    toolchain {
        languageVersion = JavaLanguageVersion.of(21)
    }
}

repositories {
    mavenCentral()
}

dependencyManagement {
    imports {
        mavenBom 'org.springframework.boot:spring-boot-dependencies:4.1.1'
    }
}

checkstyle {
    toolVersion = '10.12.5'
    configFile = rootProject.file('config/naver-checkstyle-rules.xml')
    configProperties = [
        'suppressionFile': rootProject.file('config/naver-checkstyle-suppressions.xml')
    ]
    ignoreFailures = false
    maxWarnings = 0
}

dependencies {
    // 기존 공통 Clock 설정을 재사용한다.
    implementation project(':common-core')

    // 서비스에서 사용할 공통 설정을 명시적으로 등록한다.
    implementation 'org.springframework:spring-context'

    // 업무 트랜잭션에 참여해 서비스 스키마의 Outbox를 저장한다.
    api 'org.springframework:spring-tx'
    implementation 'org.springframework:spring-jdbc'

    // 서비스의 JSON 설정으로 메타데이터와 업무 필드를 직렬화한다.
    api 'tools.jackson.core:jackson-databind'

    // 서비스와 같은 AWS BOM을 사용하고 자동 설정 없이 필요한 SDK 클라이언트만 연결한다.
    api platform('io.awspring.cloud:spring-cloud-aws-dependencies:4.1.1')
    api 'software.amazon.awssdk:sns'
    api 'software.amazon.awssdk:sqs'
    implementation 'org.slf4j:slf4j-api'

    // 생성자 주입을 기존 공통 모듈과 동일하게 구성한다.
    compileOnly 'org.projectlombok:lombok'
    annotationProcessor 'org.projectlombok:lombok'

    // 공통 이벤트 처리의 동작과 결과를 검증한다.
    testImplementation 'org.junit.jupiter:junit-jupiter'
    testImplementation 'org.assertj:assertj-core'
    testImplementation 'org.mockito:mockito-junit-jupiter'
    testImplementation 'org.testcontainers:testcontainers-junit-jupiter'
    testImplementation 'org.testcontainers:testcontainers-mysql'
    testRuntimeOnly 'com.mysql:mysql-connector-j'
    // 수신 스레드의 이벤트 추적 정보와 처리 후 MDC 복원을 검증한다.
    testRuntimeOnly 'ch.qos.logback:logback-classic'
    testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
}

tasks.named('test') {
    useJUnitPlatform()
}

tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8'
}
