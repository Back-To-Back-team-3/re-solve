plugins {
    id 'java-library'
    id 'io.spring.dependency-management' version '1.1.7'
    id 'checkstyle'
}

group = 'com.backtoback'
version = '1.0-SNAPSHOT'

java {
    toolchain {
        languageVersion = JavaLanguageVersion.of(21)
    }
}

repositories {
    mavenCentral()
}

dependencyManagement {
    imports {
        mavenBom 'org.springframework.boot:spring-boot-dependencies:4.1.1'
    }
}

checkstyle {
    toolVersion = '10.12.5'
    configFile = rootProject.file('config/naver-checkstyle-rules.xml')
    configProperties = [
        'suppressionFile': rootProject.file('config/naver-checkstyle-suppressions.xml')
    ]
    ignoreFailures = false
    maxWarnings = 0
}

dependencies {
    // 공통 Clock 설정과 JPA 감사 시간 공급자 연결
    implementation project(':common-core')
    implementation 'org.springframework:spring-context'
    implementation 'org.springframework.data:spring-data-jpa'

    // 공통 Entity의 매핑과 이를 상속하는 서비스 Entity에 사용하는 JPA 타입
    api 'jakarta.persistence:jakarta.persistence-api'

    // JPA 감사 리스너에 Spring의 감사 처리기 연결
    runtimeOnly 'org.springframework:spring-aspects'

    // Lombok
    compileOnly 'org.projectlombok:lombok'
    annotationProcessor 'org.projectlombok:lombok'
}

tasks.named('test') {
    useJUnitPlatform()
}

tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8'
}
